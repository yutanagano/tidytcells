[tox]
env_list =
    lint, fetchdata, docs, py{311, 312, 313, 314, 315}

[gh]
python =
    3.11 = py311
    3.12 = py312
    3.13 = py313
    3.14 = py314
    3.15 = py315

[testenv]
description = run unit tests
deps =
    pytest>=7
commands =
    pytest tests

[testenv:lint]
description = run linters
skip_install = true
deps =
    black[jupyter]>=23
commands = black .

[testenv:fetchdata]
description = fetch updated gene data from IMGT/HGNC/OGRDB
skip_install = true
deps =
    bs4
    pandas
    pyarrow
    odfpy
    requests
    receptor-utils
commands =
    python scripts/homosapiens_tr_imgt_catalogue.py
    python scripts/homosapiens_ig_imgt_catalogue.py
    python scripts/homosapiens_mh_ipd_catalogue.py
    python scripts/musmusculus_tr_imgt_catalogue.py
    python scripts/musmusculus_ig_imgt_catalogue.py
    python scripts/homosapiens_ig_ogrdb_catalogue.py
    python scripts/mh_mro_catalogue.py

[testenv:docs]
description = build sphinx docs
deps =
    sphinx>=6
    sphinx-book-theme
commands =
    sphinx-build docs docs/_build
